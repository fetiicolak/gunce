# Supabase ücretsiz projeleri 7 gün hareketsiz kalınca uykuya geçer.
# Bu iş 3 günde bir veritabanına küçük bir istek atar.
# GitHub, 60 gün commit olmayan repolarda zamanlanmış işleri kapattığı için
# iş her çalışmada kendini API üzerinden yeniden etkinleştirir (commit gerekmez).
name: Supabase uyanık tut

on:
  schedule:
    - cron: '23 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Veritabanına ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/lists?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          test "$code" = "200"
      - name: Zamanlamayı canlı tut
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
